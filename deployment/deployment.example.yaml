---
# minAvailable 1 against replicas 2. It must stay strictly below replicas or a
# node drain deadlocks.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: kss-client-web-fleet-pdb
  namespace: kss-client-web-fleet
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: kss-client-web-fleet
