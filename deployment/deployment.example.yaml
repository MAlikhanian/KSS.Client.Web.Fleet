# =============================================================================
#  KSS Client Web - fleet domain app (multi-zone)
# =============================================================================
#  Modelled on the dms zone's deployment manifest. Every identifier below is
#  derived from this zone's own values (folder "Fleet", slug "fleet", basePath
#  "/fleet"), not adapted by search-and-replace from another zone's file.
#
#  WHAT THIS ZONE IS: frontend with synthetic mock data only. It has NO backend
#  service and NO data store; it calls nothing but the Shell's session.
#
#  ---------------------------------------------------------------------------
#  1. NO INGRESS.
#
#  /fleet is reached only through the Shell, the estate's single public
#  entrypoint. No Ingress object and no ingress host are set in this file.
#
#  ---------------------------------------------------------------------------
#  2. ACCESS IS GATED IN THE APP, ON ONE PERMISSION.
#
#  Every screen sits in the app/(fleet) route group behind FleetAccessGate,
#  which renders the screens only when the session carries the Fleet read
#  permission (lib/fleet/access.ts). There is no role bypass. The health route
#  (app/api/health) is outside that group, so the probes below answer without a
#  session - they must, or a healthy pod would never become Ready.
#
#  ---------------------------------------------------------------------------
#  THREE THINGS ARE NOT IN THIS FILE, AND ALL THREE EXIST IN THE CLUSTER ALREADY:
#
#   A. The namespace's docker-secret (image pull). Secrets are
#      namespace-scoped; without it pods sit in ImagePullBackOff.
#
#   B. The Secret kss-client-web-fleet-secrets, holding nextauth-secret ONLY.
#      It is deliberately not declared here: a checked-in Secret would be
#      re-blanked by every `kubectl apply`. See the note at NEXTAUTH_SECRET.
#
#   C. A NetworkPolicy. The dms file carries one that is marked do-not-apply
#      (its egress list omits DNS). It is NOT copied: an object known to break
#      name resolution does not belong in a file that is applied whole.
# =============================================================================

apiVersion: v1
kind: Namespace
metadata:
  name: kss-client-web-fleet
  labels:
    name: kss-client-web-fleet
    app: kss-client-web-fleet
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kss-client-web-fleet
  namespace: kss-client-web-fleet
  labels:
    app: kss-client-web-fleet
    version: v1.0.0
  annotations:
    keel.sh/policy: force
    keel.sh/match-tag: "true"
    keel.sh/trigger: poll
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: kss-client-web-fleet
  template:
    metadata:
      labels:
        app: kss-client-web-fleet
        version: v1.0.0
    spec:
      imagePullSecrets:
      - name: docker-secret
      containers:
      - name: kss-client-web-fleet
        image: docker-hosted.sebaoffice.ir/kss-client-web-fleet:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3000"
        - name: HOSTNAME
          value: "0.0.0.0"
        - name: TZ
          value: "UTC"

        # The session cookie carries every permission claim and overflows Node's
        # default 16 KB header buffer; this zone receives that same cookie.
        - name: NODE_OPTIONS
          value: "--max-http-header-size=131072"

        # -- Auth -------------------------------------------------------------
        # MUST BE BYTE-IDENTICAL TO THE SHELL'S, or the session cookie the Shell
        # issued cannot be decrypted and every visitor is treated as signed out.
        # Absent + non-optional fails loudly (CreateContainerConfigError); an
        # EMPTY value would start the pod and fail every request instead.
        - name: NEXTAUTH_SECRET
          valueFrom:
            secretKeyRef:
              name: kss-client-web-fleet-secrets
              key: nextauth-secret

        # The public origin. Cookies are scoped by host and path, never by port
        # or by which pod answered, so this stays the Shell's URL.
        - name: NEXTAUTH_URL
          value: "https://erp.seba.ir"

        # Used only by the DEV-ONLY /api/auth rewrite in next.config.mjs; inert
        # in cluster, set for parity and for a local `docker run`.
        - name: SHELL_URL
          value: "https://erp.seba.ir"

        # -- Application ------------------------------------------------------
        # Inlined at BUILD time by the Dockerfile ARG (default "/fleet"). Set at
        # runtime too so a mismatch shows in `kubectl describe`. It must equal
        # next.config.mjs's basePath.
        - name: NEXT_PUBLIC_BASE_PATH
          value: "/fleet"
        - name: NEXT_PUBLIC_APP_NAME
          value: "KSS_Client_Web_fleet"

        # -- Tenant branding --------------------------------------------------
        # Read by lib/tenants.ts. The ConfigMap value is copied programmatically
        # from the dms zone's manifest, not transcribed. configMapKeyRef is
        # frozen at container start: a ConfigMap change needs a rollout restart.
        - name: TENANTS
          valueFrom:
            configMapKeyRef:
              name: kss-client-web-fleet-config
              key: tenants

        # -- Backend services -------------------------------------------------
        # ONE: Auth, because the shared services/auth-api.ts reads it. The zone
        # has no service of its own and calls nothing else.
        - name: AUTH_API_BASE_URL
          valueFrom:
            configMapKeyRef:
              name: kss-client-web-fleet-config
              key: auth-api-base-url

        # No object-storage variables: nothing in this app uploads, and the
        # zone's Secret holds nextauth-secret only.

        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"

        # -- Probes -----------------------------------------------------------
        # app/api/health/route.ts, served under the basePath. timeoutSeconds is
        # explicit on all three; the default is 1s and a cold start exceeds it.
        livenessProbe:
          httpGet: { path: /fleet/api/health, port: 3000, scheme: HTTP }
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 5
        readinessProbe:
          httpGet: { path: /fleet/api/health, port: 3000, scheme: HTTP }
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
        startupProbe:
          httpGet: { path: /fleet/api/health, port: 3000, scheme: HTTP }
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 24

        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1001
          runAsGroup: 1001
          readOnlyRootFilesystem: false
          capabilities:
            drop: [ALL]
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: kss-client-web-fleet-service
  namespace: kss-client-web-fleet
  labels:
    app: kss-client-web-fleet
spec:
  selector:
    app: kss-client-web-fleet
  ports:
  - name: http
    port: 80
    targetPort: 3000
    protocol: TCP
  type: ClusterIP
  sessionAffinity: None
---
# auth-api-base-url and tenants are copied from the dms zone's manifest, which
# copies them from the Shell's, so the zones cannot drift from each other.
apiVersion: v1
kind: ConfigMap
metadata:
  name: kss-client-web-fleet-config
  namespace: kss-client-web-fleet
